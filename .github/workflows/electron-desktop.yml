# MACOS SIGNING: NOT CONFIGURED
# NOTARIZATION: PENDING CREDENTIALS
# WINDOWS CODE SIGNING: NOT CONFIGURED
# Secret names only. Do not put certificate material in this file.
# APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER, CSC_LINK, CSC_KEY_PASSWORD
name: electron-desktop

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop job to run
        type: choice
        options:
          - linux
          - windows
          - macos
          - all
        default: linux
  push:
    branches:
      - feat/character-creator-final-closure
    paths:
      - .github/workflows/electron-desktop.yml
      - electron/**
      - package.json
      - studio-web/**
      - studio-api/**

jobs:
  windows-x64:
    if: ${{ inputs.platform == 'windows' || inputs.platform == 'all' }}
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --prefix studio-web install
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packaged API dependencies for the Windows runtime
        run: node electron/scripts/prepare-windows-venv.mjs
      - run: node electron/scripts/build-windows.mjs
      - name: Certify packaged boot, install, reinstall, and uninstall
        run: |
          node electron/scripts/certify-windows.mjs
          node electron/scripts/certify-installer.mjs
          node electron/scripts/assert-windows-release-boot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adept-ui-desktop-win-x64-cert
          path: |
            electron/build/cert-result.json
            electron/build/installer-cert.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: adept-ui-desktop-win-x64
          path: |
            electron/dist/*.exe
            electron/dist/win-unpacked/**
          if-no-files-found: error

  macos-arm64:
    if: ${{ inputs.platform == 'macos' || inputs.platform == 'all' }}
    # macos-14 is Apple Silicon. macos-13 is Intel and must not build this package.
    runs-on: macos-14
    timeout-minutes: 180
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Apple Silicon
        run: |
          test "$(uname -m)" = "arm64"
          echo "MACOS NATIVE RUNNER = PASS"
      - run: npm install
      - run: npm --prefix studio-web install
      - name: Stage Python, install API dependencies, stage Studio API, build app
        run: node electron/scripts/build-macos.mjs
      - name: Launch packaged app and wait for Studio API
        run: node electron/scripts/smoke-macos.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adept-ui-desktop-mac-arm64
          path: |
            electron/dist/*.dmg
            electron/build/macos-smoke-result.json
            electron/build/macos-evidence/**
          if-no-files-found: error

  linux-x64:
    if: ${{ github.event_name == 'push' || inputs.platform == 'linux' || inputs.platform == 'all' || inputs.platform == '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Skip full Linux packaging for a macOS-only change
        id: linux_scope
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$before" "${{ github.sha }}" > /tmp/changed-files.txt
          cat /tmp/changed-files.txt
          run=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              electron/scripts/smoke-macos.mjs|electron/scripts/build-macos.mjs|electron/scripts/stage-packaged-runtime-darwin.mjs|electron/entitlements.mac.plist|electron/packaged-requirements.test.mjs|electron/main.cjs|studio-api/runtime_supervisor/ports.py|studio-api/runtime_supervisor/process.py|studio-api/tests/test_runtime_supervisor_lifecycle.py|electron/E*.md|studio-web/*)
                ;;
              electron/platform/menu.cjs)
                if git diff "$before" "${{ github.sha }}" -- "$file" | grep '^+' | grep -v '^+++' | grep -F 'Alt+F4' >/dev/null; then
                  run=true
                fi
                ;;
              electron/builder.config.cjs)
                if git diff "$before" "${{ github.sha }}" -- "$file" | grep '^+' | grep -v '^+++' | grep -E 'linux:|deb:|rpm:|appImage|win:|nsis' >/dev/null; then
                  run=true
                fi
                ;;
              .github/workflows/electron-desktop.yml)
                linux_build=$(printf '%s%s' 'build-' 'linux')
                linux_smoke=$(printf '%s%s' 'smoke-' 'linux')
                if git diff "$before" "${{ github.sha }}" -- "$file" | grep '^+' | grep -v '^+++' | grep -F "$linux_build" >/dev/null; then
                  run=true
                fi
                if git diff "$before" "${{ github.sha }}" -- "$file" | grep '^+' | grep -v '^+++' | grep -F "$linux_smoke" >/dev/null; then
                  run=true
                fi
                ;;
              *)
                run=true
                ;;
            esac
          done < /tmp/changed-files.txt
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: github.event_name != 'push' || steps.linux_scope.outputs.run == 'true'
        with:
          node-version: 22
      - name: Linux build prerequisites
        if: github.event_name != 'push' || steps.linux_scope.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 libatspi2.0-0 \
            libgbm1 libasound2 xvfb libfuse2 lsof ca-certificates fakeroot rpm
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          test "$(uname -m)" = "x86_64"
          echo "LINUX NATIVE RUNNER = PASS"
      - run: npm install
        if: github.event_name != 'push' || steps.linux_scope.outputs.run == 'true'
      - run: npm --prefix studio-web install
        if: github.event_name != 'push' || steps.linux_scope.outputs.run == 'true'
      - name: Stage Linux Python, install dependencies, build AppImage, deb, and rpm
        if: github.event_name != 'push' || steps.linux_scope.outputs.run == 'true'
        run: node electron/scripts/build-linux.mjs
      - name: Launch packaged Adept UI under Xvfb and certify
        if: github.event_name != 'push' || steps.linux_scope.outputs.run == 'true'
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" node electron/scripts/smoke-linux.mjs
      - uses: actions/upload-artifact@v4
        if: always() && (github.event_name != 'push' || steps.linux_scope.outputs.run == 'true')
        with:
          name: adept-ui-desktop-linux-x64
          path: |
            electron/dist/*.AppImage
            electron/dist/*.deb
            electron/dist/*.rpm
            electron/build/linux-smoke-result.json
            electron/build/linux-evidence/**
            electron/build/linux-python-ldd.txt
          if-no-files-found: warn

  fedora-rpm:
    needs: linux-x64
    if: needs.linux-x64.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: adept-ui-desktop-linux-x64
          path: electron/dist
      - name: Prepare Fedora evidence directory
        run: mkdir -p electron/build/fedora-evidence
      - name: Install and launch the RPM in a Fedora container
        run: |
          docker run --rm \
            --security-opt seccomp=unconfined \
            -v "$PWD/electron/dist:/packages:ro" \
            -v "$PWD/electron/scripts:/scripts:ro" \
            -v "$PWD/electron/build/fedora-evidence:/evidence" \
            fedora:41 \
            bash /scripts/smoke-fedora-container.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adept-ui-fedora-evidence
          path: electron/build/fedora-evidence/**
          if-no-files-found: warn
