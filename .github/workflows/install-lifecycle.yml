name: install-lifecycle

on:
  workflow_dispatch:
  push:
    paths:
      - install/**
      - .github/workflows/install-lifecycle.yml

jobs:
  lifecycle:
    name: Installation lifecycle simulation
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run installation lifecycle tests
        run: |
          python -m pip install pytest
          python -m pytest install/lifecycle/tests -q
      - name: Sign exactly what you publish
        run: python install/lifecycle/verify_published_catalog.py --publishable
      - name: Sign exactly what you publish with OpenSSL
        if: runner.os != 'Windows'
        run: python install/lifecycle/verify_published_catalog.py --publishable --require-openssl

  macos-install:
    name: macOS application install
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install the signed Apple Silicon release
        run: |
          export ADEPT_CATALOG_FILE="$GITHUB_WORKSPACE/install/catalog/current.json"
          export ADEPT_SIGNATURE_FILE="$GITHUB_WORKSPACE/install/catalog/current.sig"
          export ADEPT_ASSUME_YES=1
          export ADEPT_NO_LAUNCH=1
          bash install/bootstrap/install.sh
      - name: Check the installed application
        run: |
          app="$HOME/.adept-ui/app/Adept UI.app"
          test -d "$app"
          test -x "$app/Contents/MacOS/Adept UI"
          test -x "$app/Contents/MacOS/Adept UI.bin"
          lipo -info "$app/Contents/MacOS/Adept UI.bin" | grep arm64
          python3 -c 'import json; from pathlib import Path; record=json.loads((Path.home()/".adept-ui"/"registry.json").read_text()); assert record["installedVersion"]=="1.1.5"'
      - name: Record Gatekeeper and launch
        run: |
          app="$HOME/.adept-ui/app/Adept UI.app"
          {
            echo "## codesign"
            codesign -dv --verbose=4 "$app" 2>&1 || true
            echo "## gatekeeper"
            spctl --assess --type execute --verbose=4 "$app" 2>&1 || true
            echo "## open"
            open "$app" 2>&1 || true
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Uninstall and keep a personal project
        run: |
          mkdir -p "$HOME/Library/Application Support/Adept UI/projects"
          echo keep > "$HOME/Library/Application Support/Adept UI/projects/keep.txt"
          for _ in 1 2 3 4 5; do
            pids="$(ps -ax -o pid=,comm= | awk '/Adept UI/ {print $1}')"
            if [ -z "$pids" ]; then
              break
            fi
            # shellcheck disable=SC2086
            kill -9 $pids 2>/dev/null || true
            sleep 1
          done
          ADEPT_UNINSTALL=1 bash install/bootstrap/install.sh
          test ! -d "$HOME/.adept-ui"
          test "$(cat "$HOME/Library/Application Support/Adept UI/projects/keep.txt")" = "keep"
