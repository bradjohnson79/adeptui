<?xml version="1.0" encoding="UTF-8"?>
<!--
  Adept UI brand mark SVG overlay for Generation Studio hero.
  Identity aligned to approved mark in hero/Adept_UI_Hero_header.png.
  Replace in-place when an official standalone SVG export is provided.
