<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Adept UI Update Manager</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070910; color: #e8ecf6; font-family: "Segoe UI", sans-serif; }
    body { display: flex; align-items: center; justify-content: center; }
    main { width: min(640px, calc(100% - 48px)); }
    img { width: 72px; height: 72px; object-fit: contain; }
    .brand { letter-spacing: 0.28em; text-transform: uppercase; color: #8b97b8; font-size: 0.78rem; margin: 12px 0 0; }
    h1 { font-size: 1.7rem; font-weight: 600; margin: 8px 0 18px; }
    p { color: #c5cce0; margin: 6px 0; }
    .bar { height: 10px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; margin: 18px 0 8px; }
    .fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #4f7cff, #8a6bff); }
    .fill.indeterminate { width: 35%; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
    .footer { margin-top: 22px; color: #9aa6c4; }
    .error { color: #e7b2a8; }
  </style>
</head>
<body>
  <main>
    <img src="/brand/adept-ui-emblem.webp" alt="Anadriya emblem" />
    <p class="brand">Adept UI Studio</p>
    <h1>Update Manager</h1>
    <p id="versions"></p>
    <p id="operation">Checking for updates</p>
    <div class="bar" aria-hidden="true"><div id="fill" class="fill indeterminate"></div></div>
    <p id="meter"></p>
    <p id="footer" class="footer"></p>
  </main>
  <script>
    function formatMB(bytes) {
      if (!bytes) return "0 MB";
      return (bytes / 1048576).toFixed(0) + " MB";
    }
    async function tick() {
      const response = await fetch("/progress", { cache: "no-store" });
      const state = await response.json();
      const installed = state.installedVersion || "";
      const target = state.targetVersion || "";
      document.getElementById("versions").textContent = target
        ? "Installed version: " + installed + "    Available version: " + target
        : (installed ? "Installed version: " + installed : "");
      document.getElementById("operation").textContent = state.operation || "Checking for updates";
      const fill = document.getElementById("fill");
      const complete = state.complete === true && state.overallPercent === 100;
      if (complete) {
        fill.classList.remove("indeterminate");
        fill.style.width = "100%";
      } else if (state.indeterminate || state.downloadPercent == null) {
        fill.classList.add("indeterminate");
        fill.style.width = "";
      } else {
        fill.classList.remove("indeterminate");
        fill.style.width = Math.max(0, Math.min(99, Number(state.downloadPercent))) + "%";
      }
      const meter = document.getElementById("meter");
      if (state.phase === "download" && state.downloadTotal) {
        const speed = state.bytesPerSecond ? Math.round(state.bytesPerSecond / 1048576) + " MB/s" : "";
        meter.textContent = "Downloaded: " + formatMB(state.downloadBytes) + " / " + formatMB(state.downloadTotal) + (speed ? "    Transfer speed: " + speed : "");
      } else {
        meter.textContent = "";
      }
      const footer = document.getElementById("footer");
      footer.className = state.error ? "footer error" : "footer";
      footer.textContent = complete ? "Updates complete." : (state.error ? state.operation : (state.phase === "install" ? "Updating Adept UI. One moment please..." : ""));
    }
    tick();
    setInterval(tick, 300);
  </script>
</body>
</html>
